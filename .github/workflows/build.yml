name: Build Windows release

# Every push builds and checks the program (the zip is kept as a run artifact).
# A release is published only when started by hand: Actions → Build Windows release → Run workflow.
# Publishing removes the older build-N releases and tags, so the Releases page keeps just the newest build.
on:
  workflow_dispatch:
  push:
    branches: [master, main, auto-export]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'glt/vcpkg.json', 'vcpkg-overlay-ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Create cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg-cache" | Out-Null

      - name: Install Vulkan SDK (for glslc)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true
          stripdown: true

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (for clang)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Pick a Clang that matches the MSVC standard library
        shell: pwsh
        run: |
          # The MSVC STL refuses older Clang versions, so prefer the Clang bundled with Visual Studio.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $bundled = Join-Path $vs "VC\Tools\Llvm\x64\bin"
          if (Test-Path (Join-Path $bundled "clang++.exe")) {
            $bin = $bundled
          } else {
            choco install llvm -y --no-progress | Out-Null
            $bin = "C:\Program Files\LLVM\bin"
          }
          & (Join-Path $bin "clang++.exe") --version
          "CLANG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Bootstrap vcpkg
        shell: cmd
        run: glt\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: cmd
        run: cmake -B build -G "Ninja Multi-Config" -DCMAKE_C_COMPILER="%CLANG_BIN%\clang.exe" -DCMAKE_CXX_COMPILER="%CLANG_BIN%\clang++.exe"

      - name: Save vcpkg binary cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'glt/vcpkg.json', 'vcpkg-overlay-ports/**') }}

      - name: Build
        shell: cmd
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $out = "dist\ZZZ-Disc-Archiver"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build\Release\*.exe $out
          Copy-Item build\Release\*.dll $out -ErrorAction SilentlyContinue
          Copy-Item build\Release\assets $out -Recurse
          Copy-Item README.md, LICENSE $out
          # Bundle the nanoka game data (names of agents, sets and W-Engines) so the first launch works offline,
          # like upstream release zips do. The program refreshes it later when a newer version is published.
          try {
            $v = (Invoke-RestMethod https://static.nanoka.cc/manifest.json).zzz.live
            function Get-Text($url) { $r = Invoke-WebRequest $url -UseBasicParsing; [System.Text.Encoding]::UTF8.GetString($r.RawContentStream.ToArray()) }
            $c = Get-Text "https://static.nanoka.cc/zzz/$v/character.json"
            $e = Get-Text "https://static.nanoka.cc/zzz/$v/equipment.json"
            $w = Get-Text "https://static.nanoka.cc/zzz/$v/weapon.json"
            $json = '{"version":"' + $v + '","characters":' + $c + ',"equipment":' + $e + ',"weapons":' + $w + '}'
            [System.IO.File]::WriteAllText("$out\assets\nanokaData.json", $json, (New-Object System.Text.UTF8Encoding $false))
            Write-Host "Bundled nanoka data version $v"
          } catch {
            Write-Warning "Could not bundle nanoka data: $_"
          }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize
          Compress-Archive -Path "$out\*" -DestinationPath "dist\ZZZ-Disc-Archiver.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZZZ-Disc-Archiver
          path: dist\ZZZ-Disc-Archiver.zip

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZZZ Disc Archiver build ${{ github.run_number }}
          body: |
            Download **ZZZ-Disc-Archiver.zip**, extract it, and run `ZZZ-Disc-Archiver.exe` (it asks for administrator rights), then log in to the game.
            Your export is saved to the `exports` folder next to the program (`latest.json` is always the newest). Press **Save updated export** after changing discs in game.
          files: dist\ZZZ-Disc-Archiver.zip
          make_latest: true

      - name: Remove older builds
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $keep = "build-${{ github.run_number }}"
          $repo = "${{ github.repository }}"
          # Older build releases (and their tags)
          gh release list -R $repo --limit 200 --json tagName --jq '.[].tagName' | Where-Object { $_ -like 'build-*' -and $_ -ne $keep } | ForEach-Object {
            Write-Host "Deleting release $_"
            gh release delete $_ -R $repo --cleanup-tag --yes
          }
          # Leftover build tags without a release (upstream's v* tags are kept)
          gh api "repos/$repo/tags?per_page=100" --jq '.[].name' | Where-Object { $_ -like 'build-*' -and $_ -ne $keep } | ForEach-Object {
            Write-Host "Deleting tag $_"
            gh api -X DELETE "repos/$repo/git/refs/tags/$_"
          }
